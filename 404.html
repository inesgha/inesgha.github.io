<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Ines Ghammam</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fcfcfd">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Même thème (clair/sombre) que le reste du site -->
  <script>
    (function () {
      var dark = false;
      try {
        var saved = localStorage.getItem('theme');
        dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    .lost { position: relative; z-index: 1; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 40px 16px; text-align: center; }
    .lost .lost__code {
      margin: 0; max-width: none;
      font-family: var(--font-display); font-weight: 600; font-style: italic;
      font-size: clamp(5rem, 22vw, 10rem); line-height: 1;
      color: var(--primary);
    }
    .lost .section__title { margin: 12px 0 14px; }
    .lost p { max-width: 440px; margin: 0 auto 30px; color: var(--text-muted); font-size: 1.05rem; }
  </style>
</head>
<body>
  <div class="butterfly-layer" id="butterfly-layer" aria-hidden="true"></div>

  <main class="lost">
    <div>
      <p class="lost__code" aria-hidden="true">404</p>
      <h1 class="section__title">Cette page s’est <em>envolée</em></h1>
      <p>La page que vous cherchez n’existe pas ou a été déplacée.</p>
      <a class="btn btn--primary" href="/">Retour à l’accueil</a>
    </div>
  </main>

  <script src="/js/butterflies.js"></script>
</body>
</html>
